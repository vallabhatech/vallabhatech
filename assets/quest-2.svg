<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#63D8D0" stroke-opacity=".07"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".3"/></pattern>
</defs>
<style>
  text{font-family:"Courier New",Consolas,"DejaVu Sans Mono",monospace;font-weight:700;white-space:pre}
  .ui{font-size:15px} .lbl{font-size:12px} .sm{font-size:13px} .big{font-size:20px} .xl{font-size:22px}
  .flick{animation:f 7s infinite} @keyframes f{0%,95%,100%{opacity:1}96%{opacity:.6}97%{opacity:1} }
  .pulse{animation:p 1.6s ease-in-out infinite} @keyframes p{0%,100%{opacity:.35}50%{opacity:1} }
  .blink{animation:b 1s step-end infinite} @keyframes b{50%{opacity:0} }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<rect width="480" height="200" fill="#080A0F"/>
<rect x="0" width="468" height="200" fill="url(#grid)"/><g class="flick" filter="url(#glow)" pointer-events="none"><rect x="464.5" y="0" width="3" height="200" fill="#63D8D0"/></g>
<rect x="16" y="12" width="424" height="176" rx="5" fill="#111923" stroke="#526A7B" stroke-opacity=".8"/><text class="lbl" x="32" y="36" fill="#AAB5C4">◆ QUEST 02</text><rect x="356" y="22" width="68" height="20" rx="3" fill="none" stroke="#63D8D0"/><rect class="pulse" x="356" y="22" width="68" height="20" rx="3" fill="#63D8D0" fill-opacity=".18"/><text class="lbl" x="390" y="36" fill="#63D8D0" text-anchor="middle">ACTIVE</text><text class="big" x="32" y="68" fill="#63D8D0" filter="url(#glow)">CareSync</text><line x1="32" y1="78" x2="424" y2="78" stroke="#526A7B" stroke-opacity=".35"/><text class="sm" x="32" y="96" fill="#526A7B">A smart, modular web app for medicine tracking,</text><text class="sm" x="32" y="114" fill="#526A7B">symptom checking, and clinic discovery, making</text><text class="sm" x="32" y="132" fill="#526A7B">healthcare simple and accessible.</text><rect x="32" y="163" width="10" height="10" fill="#f1e05a"/><text class="lbl" x="48" y="172" fill="#63D8D0">JavaScript</text><text class="lbl" x="138" y="172" fill="#526A7B">★ 28   forks 15   played today</text><text class="lbl" x="424" y="172" fill="#63D8D0" text-anchor="end" filter="url(#glow)">OPEN &gt;&gt;</text><rect width="480" height="200" fill="url(#scan)" pointer-events="none"/>
</svg>
