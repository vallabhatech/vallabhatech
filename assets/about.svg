CTS</text><text class="lbl" x="594" y="130" fill="#8CB9F4" filter="url(#glow)">[+]</text><text class="lbl" x="624" y="130" fill="#AAB5C4">BUILDING</text><text class="sm" x="624" y="147" fill="#63D8D0">AI-powered products, developer tools &amp;</text><text class="sm" x="624" y="163" fill="#63D8D0">practical systems</text><text class="lbl" x="594" y="188" fill="#8CB9F4" filter="url(#glow)">[&amp;]</text><text class="lbl" x="624" y="188" fill="#AAB5C4">SEEKING PARTY</text><text class="sm" x="624" y="205" fill="#63D8D0">Open source collaborators, hackathons</text><text class="sm" x="624" y="221" fill="#63D8D0">&amp; ambitious builders</text><text class="lbl" x="594" y="246" fill="#8CB9F4" filter="url(#glow)">[?]</text><text class="lbl" x="624" y="246" fill="#AAB5C4">ASK ME ABOUT</text><text class="sm" x="624" y="263" fill="#63D8D0">Full-stack apps, AI/ML, Android,</text><text class="sm" x="624" y="279" fill="#63D8D0">GitHub &amp; cloud systems</text><text class="lbl" x="594" y="304" fill="#8CB9F4" filter="url(#glow)">[!]</text><text class="lbl" x="624" y="304" fill="#AAB5C4">FUN FACT</text><text class="sm" x="624" y="321" fill="#63D8D0">I turn GitHub profiles, college</text><text class="sm" x="624" y="337" fill="#63D8D0">systems and hackathon ideas into thin…</text><rect x="40" y="378" width="880" height="164" rx="4" fill="#111923" stroke="#526A7B" stroke-opacity=".7"/><text class="lbl" x="54" y="400" fill="#AAB5C4">EQUIPPED GEAR &amp; SKILLS</text><text class="lbl" x="54" y="433" fill="#AAB5C4">GEAR</text><rect x="118" y="418" width="70" height="22" rx="3" fill="#000" stroke="#63D8D0" stroke-opacity=".9"/><text class="sm" x="153" y="433" fill="#63D8D0" text-anchor="middle" filter="url(#glow)">Python</text><rect x="196" y="418" width="102" height="22" rx="3" fill="#000" stroke="#63D8D0" stroke-opacity=".9"/><text class="sm" x="247" y="433" fill="#63D8D0" text-anchor="middle" filter="url(#glow)">TypeScript</text><rect x="306" y="418" width="102" height="22" rx="3" fill="