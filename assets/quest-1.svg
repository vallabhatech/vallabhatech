<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#63D8D0" stroke-opacity=".07"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".3"/></pattern>
</defs>
<style>
  text{font-family:"Courier New",Consolas,"DejaVu Sans Mono",monospace;font-weight:700;white-space:pre}
  .ui{font-size:15px} .lbl{font-size:12px} .sm{font-size:13px} .big{font-size:20px} .xl{font-size:22px}
  .flick{animation:f 7s infinite} @keyframes f{0%,95%,100%{opacity:1}96%{opacity:.6}97%{opacity:1} }
  .pulse{animation:p 1.6s ease-in-out infinite} @keyframes p{0%,100%{opacity:.35}50%{opacity:1} }
  .blink{animation:b 1s step-end infinite} @keyframes b{50%{opacity:0} }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<rect width="480" height="200" fill="#080A0F"/>
<rect x="12" width="468" height="200" fill="url(#grid)"/><g class="flick" filter="url(#glow)" pointer-events="none"><rect x="12.5" y="0" width="3" height="200" fill="#63D8D0"/></g>
<rect x="40" y="12" width="424" height="176" rx="5" fill="#111923" stroke="#526A7B" stroke-opacity=".8"/><text class="lbl" x="56" y="36" fill="#AAB5C4">◆ QUEST 01</text><rect x="340" y="22" width="108" height="20" rx="3" fill="none" stroke="#8CB9F4"/><text class="lbl" x="394" y="36" fill="#8CB9F4" text-anchor="middle">IN PROGRESS</text><text class="big" x="56" y="68" fill="#63D8D0" filter="url(#glow)">V.E.R.I.T.A.S</text><line x1="56" y1="78" x2="448" y2="78" stroke="#526A7B" stroke-opacity=".35"/><text class="sm" x="56" y="96" fill="#526A7B">No quest log yet. Uncharted territory.</text><rect x="56" y="163" width="10" height="10" fill="#3178c6"/><text class="lbl" x="72" y="172" fill="#63D8D0">TypeScript</text><text class="lbl" x="162" y="172" fill="#526A7B">★ 6   forks 1   played 2mo ago</text><text class="lbl" x="448" y="172" fill="#63D8D0" text-anchor="end" filter="url(#glow)">OPEN &gt;&gt;</text><rect width="480" height="200" fill="url(#scan)" pointer-events="none"/>
</svg>
