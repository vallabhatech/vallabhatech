name: Update profile

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC (11:47 India)
  workflow_dispatch:        # adds a "Run workflow" button
  push:
    paths: ["tools/DungeonGen/**", ".github/workflows/dungeon.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Generate profile
        run: dotnet run --project tools/DungeonGen -c Release -- ${{ github.repository_owner }} --assets assets --html docs/index.html --readme README.md
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets docs README.md
          git diff --cached --quiet || (git commit -m "🗡️ Refresh profile" && git push)
